server.port=8080

# Spring Application Name
spring.application.name=secureqr-health

# Firebase Configuration
firebase.project-id=${FIREBASE_PROJECT_ID:carekey-468e8}
firebase.client-email=${FIREBASE_CLIENT_EMAIL:}
firebase.private-key=${FIREBASE_PRIVATE_KEY:}

# Gemini AI Configuration
gemini.api-key={GCP_API_KEY}
gemini.model=gemini-1.5-flash

# Public-Health Aggregation Privacy Threshold (PRD §14)
privacy.aggregation.threshold-k=10

# Logging
logging.level.com.carekey=DEBUG
logging.level.org.springframework.security=INFO
